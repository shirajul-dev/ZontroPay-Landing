<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Page Not Found - ZontroPay</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="./assets/zontropay/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/zontropay/favicon.png" />
    <link rel='stylesheet' id='pxl-main-css-css' href='./assets/wp-content/plugins/case-addons/assets/css/pxl-main-css.min.css' type='text/css' media='all' />
    <link rel='stylesheet' id='font-awesome-pro-css' href='./assets/wp-content/plugins/case-addons/assets/libs/font-awesome-pro/css/all.min.css' type='text/css' media='all' />
    <link rel='stylesheet' id='pxl-caseicon-css' href='./assets/wp-content/themes/brighthub/assets/css/pxl-caseicon.min.css' type='text/css' media='all' />
    <link rel='stylesheet' id='pxl-phosphor-css' href='./assets/wp-content/themes/brighthub/assets/css/pxl-phosphor.min.css' type='text/css' media='all' />
    <link rel='stylesheet' id='pxl-grid-css' href='./assets/wp-content/themes/brighthub/assets/css/pxl-grid.min.css' type='text/css' media='all' />
    <link rel='stylesheet' id='pxl-style-css' href='./assets/wp-content/themes/brighthub/assets/css/pxl-style.min.css' type='text/css' media='all' />
    <link rel='stylesheet' id='pxl-base-css' href='./assets/wp-content/themes/brighthub/pxl-base.min.css' type='text/css' media='all' />
    <style>
        :root {
            --accent: #fb6514;
            --ink: #0b0f19;
            --muted: #5b6472;
            --line: rgba(11, 15, 25, 0.08);
            --panel: rgba(255, 255, 255, 0.88);
        }
        html, body { margin: 0; padding: 0; min-height: 100%; background: radial-gradient(circle at top left, rgba(251, 101, 20, 0.18), transparent 28%), linear-gradient(180deg, #fff8f4 0%, #ffffff 36%, #f7f5f2 100%); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
        a { color: inherit; text-decoration: none; }
        .page-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .panel { width: min(960px, 100%); background: var(--panel); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 18px 50px rgba(11, 15, 25, 0.08); border-radius: 32px; overflow: hidden; }
        .panel-inner { padding: 28px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: -0.02em; }
        .brand img { height: 32px; width: auto; display: block; }
        .topbar-nav {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .topbar-nav::-webkit-scrollbar { display: none; }
        .topbar-nav a { white-space: nowrap; flex: 0 0 auto; }
        .hero { padding: 58px 12px 36px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
        .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 700; margin-bottom: 14px; }
        .eyebrow:before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(251, 101, 20, 0.12); }
        h1, p { margin: 0; }
        h1 { font-size: clamp(2.6rem, 6vw, 5rem); line-height: .95; letter-spacing: -0.06em; max-width: 8ch; }
        p { color: var(--muted); line-height: 1.75; margin-top: 18px; max-width: 56ch; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 18px; border-radius: 999px; font-weight: 700; border: 1px solid transparent; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { border-color: var(--line); background: rgba(255,255,255,0.85); }
        .code-box {
            width: 220px;
            aspect-ratio: 1;
            border-radius: 30px;
            border: 1px solid rgba(11, 15, 25, 0.08);
            background:
                radial-gradient(circle at 35% 35%, rgba(251,101,20,0.25), transparent 28%),
                linear-gradient(180deg, rgba(11,15,25,0.95), rgba(11,15,25,0.72));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.08em;
        }
        .footer {
            padding: 18px 28px 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            color: var(--muted);
        }
        .footer-links { display: flex; flex-wrap: wrap; gap: 14px; }
        .footer-links a:hover { color: var(--ink); }
        @media (max-width: 780px) {
            .topbar { flex-direction: column; align-items: flex-start; }
            .topbar-nav { width: 100%; }
            .hero { grid-template-columns: 1fr; }
            .code-box { width: 160px; }
            .panel-inner { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="panel">
            <div class="panel-inner">
                <div class="topbar">
                    <a class="brand" href="./index.html">
                        <img src="./assets/logo_v2_black.png" alt="ZontroPay" />
                    </a>
                    <nav class="footer-links topbar-nav" aria-label="Primary">
                        <a href="./index.html">Home</a>
                        <a href="./about.html">About</a>
                        <a href="./our-teams.html">Our Team</a>
                        <a href="./contact.html">Contact</a>
                        <a href="./privacy-policy.html">Privacy</a>
                        <a href="./terms-conditions.html">Terms</a>
                    </nav>
                </div>

                <section class="hero">
                    <div>
                        <div class="eyebrow">Error 404</div>
                        <h1>Page not found</h1>
                        <p>The page you requested is unavailable or has been moved. Use the links below to return to ZontroPay or contact the team if you need help finding the right page.</p>
                        <div class="actions">
                            <a class="btn btn-primary" href="./index.html">Back to Home</a>
                            <a class="btn btn-secondary" href="./contact.html">Contact Support</a>
                        </div>
                    </div>
                    <div class="code-box">404</div>
                </section>
            </div>
            <div class="footer">
                <span>© 2026 ZontroPay</span>
                <div class="footer-links">
                    <a href="./about.html">About</a>
                    <a href="./terms-conditions.html">Terms</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
